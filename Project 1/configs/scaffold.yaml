iterations: 7000

# Anchor model params
feat_dim: 32
n_offsets: 10
voxel_size: 0.001
update_depth: 3
update_init_factor: 16
update_hierachy_factor: 4
appearance_dim: 32
ratio: 1

# Learning rates - anchor positions (not trained)
position_lr_init: 0.0
position_lr_final: 0.0
position_lr_max_steps: 7000

# Learning rates - offsets
offset_lr_init: 0.01
offset_lr_final: 0.0001
offset_lr_max_steps: 7000

# Learning rates - gaussian attributes
feature_lr: 0.0075
opacity_lr: 0.02
scaling_lr: 0.007
rotation_lr: 0.002

# MLP learning rates
mlp_opacity_lr_init: 0.002
mlp_opacity_lr_final: 0.00002
mlp_opacity_lr_max_steps: 7000

mlp_cov_lr_init: 0.004
mlp_cov_lr_final: 0.004
mlp_cov_lr_max_steps: 7000

mlp_color_lr_init: 0.008
mlp_color_lr_final: 0.00005
mlp_color_lr_max_steps: 7000

# Densification
percent_dense: 0.01
lambda_dssim: 0.2
start_stat: 500
update_from: 1500
update_interval: 100
update_until: 5000
min_opacity: 0.005
success_threshold: 0.8
densify_grad_threshold: 0.0002

white_background: false
