# Scaffold-GS resume config: 7000 -> 12000
# Resume from chkpnt7000.pth, extend anchor growing to 9000, polish 3000

iterations: 12000

# Anchor model
feat_dim: 32
n_offsets: 10
voxel_size: 0.001
update_depth: 3
update_init_factor: 16
update_hierachy_factor: 4
appearance_dim: 32
ratio: 1

# LR - anchor position (frozen)
position_lr_init: 0.0
position_lr_final: 0.0
position_lr_max_steps: 12000

# LR - offsets
offset_lr_init: 0.01
offset_lr_final: 0.0001
offset_lr_max_steps: 12000

# LR - gaussian attributes
feature_lr: 0.0075
opacity_lr: 0.02
scaling_lr: 0.007
rotation_lr: 0.002

# MLP LRs (extended to 12000)
mlp_opacity_lr_init: 0.002
mlp_opacity_lr_final: 0.00002
mlp_opacity_lr_max_steps: 12000

mlp_cov_lr_init: 0.004
mlp_cov_lr_final: 0.004
mlp_cov_lr_max_steps: 12000

mlp_color_lr_init: 0.008
mlp_color_lr_final: 0.00005
mlp_color_lr_max_steps: 12000

# Densification (EXTENDED)
percent_dense: 0.01
lambda_dssim: 0.2
start_stat: 500
update_from: 1500
update_interval: 100
update_until: 9000          # was 5000 -> extend anchor growing to 9000
min_opacity: 0.005
success_threshold: 0.8       # keep default (0.8)
densify_grad_threshold: 0.0001  # was 0.0002 -> more aggressive

white_background: false
