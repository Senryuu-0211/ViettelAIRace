# ⛔⛔ ĐÃ HỦY — KHÔNG NỘP FILE NÀY ⛔⛔
# T1 (chunk 4096) đã đo được 58.44 < 59.32: TTFT xấu đi, TPOT KHÔNG cải thiện.
# Thêm nữa, phân tích trace cho thấy concurrency thực tế chỉ ~2 (đỉnh 6) nên prefill
# gần như không đụng nhau -> giả thuyết "prefill treo decode" sai. Nhánh này đóng.
# Giữ file lại chỉ để lưu vết thí nghiệm.
#
# T2 — như T1 nhưng chunk NHỎ HƠN NỮA: max-num-batched-tokens = 2048
services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=5120
      - --max-num-seqs=16
      - --max-num-batched-tokens=2048      # <<< BIẾN DUY NHẤT ĐỔI (8192 -> 2048)
      - --enable-prefix-caching
      - --quantization=fp8
      - --async-scheduling
      - '--compilation-config={"cudagraph_capture_sizes": [1, 2, 4, 8, 16]}'
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --disable-log-stats
      - --uvicorn-log-level=warning
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
