# T4 — BIẾN DUY NHẤT: nâng vLLM v0.22.1 -> v0.25.1 (giữ NGUYÊN mọi cờ của bản 59.32)
#
# LÝ DO: bản 56.38 có dùng v0.25.1 nhưng đổi kèm 5 thứ khác (seqs 32, batched-tok 16384,
# mem 0.95, flashinfer, cudagraph FULL) -> KHÔNG kết luận được version tốt hay xấu.
# Bản này tách đúng 1 biến để trả lời câu hỏi đó.
#
# CƠ CHẾ: TPOT ở đây là host-bound (xem OPTIMIZATION_ANALYSIS.md §4). Các bản vLLM mới
# chủ yếu cắt overhead vòng lặp engine phía CPU — đúng thứ ta đang thiếu.
services:
  model:
    image: vllm/vllm-openai:v0.25.1      # <<< BIẾN DUY NHẤT ĐỔI (0.22.1 -> 0.25.1)
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=5120
      - --max-num-seqs=16
      - --max-num-batched-tokens=8192
      - --enable-prefix-caching
      - --quantization=fp8
      - --async-scheduling
      - '--compilation-config={"cudagraph_capture_sizes": [1, 2, 4, 8, 16]}'
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --disable-log-stats
      - --uvicorn-log-level=warning
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
