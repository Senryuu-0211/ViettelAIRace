# Thử nghiệm: LFM2.5-1.2B-Instruct qua llama.cpp (native support cho kiến trúc
# hybrid lfm2, thay vì vLLM đang coi đây là "experimental")
# Image chính thức từ ggml-org, build sẵn CUDA — không cần Dockerfile riêng
services:
  model:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command:
      # Tải thẳng GGUF chính chủ Liquid AI qua HF, chọn mức quant (đổi sang
      # Q4_K_M nếu muốn nhanh hơn nữa — vẫn nằm trong ngân sách Δ≤0.10 miễn phí)
      - -hf
      - LiquidAI/LFM2.5-1.2B-Instruct-GGUF:Q8_0
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      # Offload toàn bộ layer lên GPU — tương đương không có gì bên vLLM vì
      # vLLM mặc định full-GPU, ở đây phải khai báo tường minh
      - --n-gpu-layers
      - "999"
      # Tương đương --max-model-len=16384
      - --ctx-size
      - "16384"
      # Số slot xử lý song song — tương đương --max-num-seqs=16
      - --parallel
      - "16"
      # Tương đương --max-num-batched-tokens=8192 (đủ prefill 1 lượt prompt ~4K)
      - --batch-size
      - "8192"
      - --ubatch-size
      - "8192"
      # Bắt buộc để đọc đúng chat template ChatML của LFM2.5
      - --jinja
      # 3 core CPU yếu — giới hạn thread tránh tranh chấp với phần điều phối
      - --threads
      - "3"
      # Sampling default theo khuyến nghị Liquid AI — chỉ áp dụng nếu request
      # của grader không tự override các tham số này
      - --temp
      - "0.1"
      - --top-k
      - "50"
      - --repeat-penalty
      - "1.05"
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]