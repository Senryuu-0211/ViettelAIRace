# Submission #2 — như docker-compose.yml + kv-cache-dtype=fp8
# Chỉ nộp SAU KHI submission #1 (docker-compose.yml) đã pass và có điểm.
# Nếu bản này crash -> flag kv-cache-dtype=fp8 là thủ phạm với hybrid LFM2.5
services:
  model:
    image: vllm/vllm-openai:v0.22.1
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m  #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=5120
      - --max-num-seqs=16
      - --max-num-batched-tokens=8192
      - --enable-prefix-caching
      - --quantization=fp8
      # Flag thử nghiệm của bản này: KV cache FP8 trên 6 attention layers
      - --kv-cache-dtype=fp8
      - '--compilation-config={"cudagraph_capture_sizes": [1, 2, 4, 8, 16]}'
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --disable-log-stats
      - --uvicorn-log-level=warning
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
